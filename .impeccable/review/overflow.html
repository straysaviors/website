<!doctype html><body><script>
const ws=[320,360,390,600,768,900,1024,1280,1920];let out=[];let i=0;
function next(){if(i>=ws.length){document.body.innerHTML='<pre id=r>'+out.join('\n')+'</pre>';return}
const w=ws[i++];const f=document.createElement('iframe');f.style.width=w+'px';f.style.height='800px';f.src='../../index.html';
f.onload=()=>setTimeout(()=>{const d=f.contentDocument;const sw=d.documentElement.scrollWidth;
const wide=[...d.querySelectorAll('body *')].filter(e=>{const r=e.getBoundingClientRect();return r.right>w+1||r.left<-1}).map(e=>e.tagName+'.'+e.className).slice(0,6);
out.push(w+': scrollWidth '+sw+(sw>w?' OVERFLOW ':' ok ')+wide.join(', '));f.remove();next()},800);document.body.appendChild(f)}
next();</script>
